to: jats_publishing+element_citations
output-file: paper.jats
extract-media: media

filters:
  - # Turn MyST directives (admonitions, figures, tables, iframes) into
    # <boxed-text>, <fig> and <table-wrap>, and replace notebook embeds such as
    # `![](#cell)` with the cell's saved output. Without it the directives reach
    # the JATS file as literal text, and pandoc cannot fetch an embed's `#cell`
    # source when extracting media, which it reports as "replacing image with
    # description". Must precede myst-parts.lua, which moves the abstract into
    # metadata, out of reach of a block filter.
    type: lua
    path: myst-admonitions.lua

  - # Lift the abstract out of the body, so the writer can put it in
    # <abstract> rather than leaving it in the running text, and typeset the
    # other MyST parts as sections.
    type: lua
    path: myst-parts.lua

  - # Handle `\ref`, `\label`, and `\autoref` commands
    type: lua
    path: resolve-references.lua

  - # Most papers have a 'references' section at the end, which makes
    # sense for most output formats. However, as references are moved to
    # the back-matter in JATS, we remove that heading.
    type: lua
    path: remove-references-heading.lua

  - # Turn ORCID identifiers into proper URIs; this is the generic
    # representation required by the spec, but impractical to use with LaTeX. We
    # do it here for that reason.
    type: lua
    path: orcid-uri.lua

# This needs more work before we can really enable it.

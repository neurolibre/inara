from: markdown
to: latex
pdf-engine: latexmk
pdf-engine-opt: -lualatex

output-file: paper.pdf
filters:
  - type: lua
    path: add-images.lua
  - type: lua
    path: draft.lua
  - type: lua
    path: self-citation.lua
  - type: lua
    path: neurolibre-handle-crowd.lua
  - type: lua
    path: conditional-archives.lua
  - type: lua
    path: myst-admonitions.lua
    # Must follow myst-admonitions.lua: it finds figure labels in the LaTeX
    # that filter emits.
  - type: lua
    path: myst-references.lua
  - type: lua
    # Must follow citeproc, which is what creates the `refs` Div this looks for.
    path: add-references-heading.lua

variables:
  # styling options
  colorlinks: true
  linkcolor: '[rgb]{1.0, 0.0, 0.0}'
  urlcolor: '[rgb]{1.0, 0.0, 0.0}'

template: '${.}/../templates/neurolibrenew.tex'